<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omantel NOC — Interactive Presentation</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Compiler for JSX in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020617;
      color: #f8fafc;
      overflow: hidden;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="relative min-h-screen">

  <!-- Three.js Background Canvas Layer -->
  <div id="canvas-container"></div>

  <!-- React Mount Point -->
  <div id="root" class="relative z-10"></div>

  <!-- Three.js 3D Background Initialization -->
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020617, 0.035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Dynamic Cyber Grid Layer
    const gridHelper = new THREE.GridHelper(60, 40, 0x06b6d4, 0x1e293b);
    gridHelper.position.y = -2;
    scene.add(gridHelper);

    // Floating Data Particles
    const geometry = new THREE.BufferGeometry();
    const count = 300;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 40;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({
      size: 0.08,
      color: 0x14b8a6,
      transparent: true,
      opacity: 0.6
    });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.0008;
      gridHelper.position.z = (gridHelper.position.z + 0.01) % 1.5;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <!-- Interactive Presentation Engine -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SLIDE_9_DATA = {
      id: 9,
      title: "Datacom & iNOC",
      subtitle: "Enterprise Data Services & International Network Operations Center Infrastructure",
      datacom: {
        title: "Datacom",
        subtitle: "Data connectivity between sites, customers & network services",
        services: [
          {
            code: "ILL",
            name: "Internet Leased Line",
            desc: "Dedicated internet connection for a customer/site."
          },
          {
            code: "P2P",
            name: "Point-to-Point",
            desc: "Direct connection between two locations."
          },
          {
            code: "SD-WAN",
            name: "Software-Defined WAN",
            desc: "Uses MPLS + Internet to connect sites through centrally managed, optimized paths.",
            benefits: ["Flexibility", "Better traffic management", "Link optimization"]
          }
        ],
        devices: ["Routers", "Switches"]
      },
      inoc: {
        title: "iNOC",
        subtitle: "Monitors and manages international connectivity and traffic",
        monitoring: [
          "Network Weather Map",
          "iNOC Console",
          "IGW Network",
          "Zoi — GGC Monitoring"
        ],
        architecture: {
          providersCustomers: ["Zain", "GGC"],
          core: "MPLS Core",
          peers: ["Content Providers", "STCs", "IX Peers", "CDNs"]
        }
      }
    };

    const SLIDES = [
      { id: 1, name: "NOC Overview & Strategy" },
      { id: 2, name: "Core Network Topology" },
      { id: 3, name: "Transport & Transmission" },
      { id: 4, name: "IP & Mobile Core Operations" },
      { id: 5, name: "Incident & Outage Management" },
      { id: 6, name: "Power & Infrastructure Monitoring" },
      { id: 7, name: "Cybersecurity & Field Operations" },
      { id: 8, name: "Subsea Cable Landing Stations" },
      { id: 9, name: "Datacom & iNOC" },
      { id: 10, name: "Future Network Automation" }
    ];

    function App() {
      const [currentSlide, setCurrentSlide] = useState(9);

      useEffect(() => {
        lucide.createIcons();
      });

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' && currentSlide < SLIDES.length) setCurrentSlide(prev => prev + 1);
          if (e.key === 'ArrowLeft' && currentSlide > 1) setCurrentSlide(prev => prev - 1);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentSlide]);

      return (
        <div className="w-full h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">
          
          {/* Header */}
          <header className="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md px-6 py-3.5 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-3 h-3 rounded-full bg-cyan-400 animate-pulse" />
              <span className="font-extrabold tracking-wider text-white text-sm uppercase font-mono">
                Omantel NOC <span className="text-cyan-400">| Control Center</span>
              </span>
            </div>

            <div className="flex items-center gap-6 text-xs font-mono text-slate-400">
              <div className="flex items-center gap-2">
                <span className="text-slate-500">SYSTEM:</span>
                <span className="text-emerald-400 font-bold flex items-center gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" /> ONLINE
                </span>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-slate-500">FEED:</span>
                <span className="text-cyan-400">iNOC-IGW-LIVE</span>
              </div>
            </div>
          </header>

          {/* Main Slide Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 flex flex-col justify-center">
            {currentSlide === 9 ? (
              <div className="space-y-6">
                
                {/* Title Banner */}
                <div className="border-b border-slate-800 pb-4 flex justify-between items-end">
                  <div>
                    <span className="text-xs font-mono tracking-widest text-cyan-400 uppercase">
                      Slide 09 — Network Operations
                    </span>
                    <h1 className="text-3xl font-black text-white flex items-center gap-3 mt-1">
                      <i data-lucide="network" class="w-8 h-8 text-cyan-400"></i>
                      {SLIDE_9_DATA.title}
                    </h1>
                  </div>
                  <p className="text-xs text-slate-400 max-w-md text-right hidden md:block font-mono">
                    {SLIDE_9_DATA.subtitle}
                  </p>
                </div>

                {/* Cards Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  
                  {/* DATACOM CARD */}
                  <section className="bg-slate-900/70 backdrop-blur-xl border border-slate-800 rounded-xl p-6 flex flex-col justify-between shadow-2xl relative overflow-hidden group hover:border-cyan-500/40 transition-all">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/5 rounded-full blur-2xl pointer-events-none" />
                    
                    <div>
                      <div className="flex items-center gap-3 mb-5">
                        <div className="p-3 bg-cyan-500/10 border border-cyan-500/30 rounded-lg text-cyan-400">
                          <i data-lucide="server" class="w-6 h-6"></i>
                        </div>
                        <div>
                          <h2 className="text-xl font-bold text-white tracking-wide">{SLIDE_9_DATA.datacom.title}</h2>
                          <p className="text-xs text-slate-400">{SLIDE_9_DATA.datacom.subtitle}</p>
                        </div>
                      </div>

                      <div className="space-y-3 my-4">
                        {SLIDE_9_DATA.datacom.services.map((svc, idx) => (
                          <div key={idx} className="bg-slate-950/60 border border-slate-800/80 rounded-lg p-3.5 hover:border-cyan-500/30 transition-colors">
                            <div className="flex items-center gap-2.5 mb-1">
                              <span className="px-2 py-0.5 text-xs font-mono font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 rounded">
                                {svc.code}
                              </span>
                              <span className="text-sm font-semibold text-slate-200">{svc.name}</span>
                            </div>
                            <p className="text-xs text-slate-400 pl-1">{svc.desc}</p>
                            
                            {svc.benefits && (
                              <div className="flex flex-wrap gap-1.5 pt-2 mt-2 border-t border-slate-800/80">
                                <span className="text-[10px] text-slate-500 font-mono font-bold uppercase mr-1">Benefits:</span>
                                {svc.benefits.map((b, bIdx) => (
                                  <span key={bIdx} className="text-[10px] bg-cyan-950/60 text-cyan-300 border border-cyan-800/50 px-2 py-0.5 rounded">
                                    • {b}
                                  </span>
                                ))}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs">
                      <span className="text-slate-400 flex items-center gap-1.5 font-medium">
                        <i data-lucide="cpu" class="w-4 h-4 text-cyan-400"></i> Devices:
                      </span>
                      <div className="flex gap-2">
                        {SLIDE_9_DATA.datacom.devices.map((device, dIdx) => (
                          <span key={dIdx} className="px-3 py-1 bg-slate-800/90 text-slate-200 rounded font-mono text-xs font-bold border border-slate-700">
                            {device}
                          </span>
                        ))}
                      </div>
                    </div>
                  </section>

                  {/* iNOC CARD */}
                  <section className="bg-slate-900/70 backdrop-blur-xl border border-slate-800 rounded-xl p-6 flex flex-col justify-between shadow-2xl relative overflow-hidden group hover:border-teal-500/40 transition-all">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-teal-500/5 rounded-full blur-2xl pointer-events-none" />

                    <div>
                      <div className="flex items-center gap-3 mb-5">
                        <div className="p-3 bg-teal-500/10 border border-teal-500/30 rounded-lg text-teal-400">
                          <i data-lucide="globe" class="w-6 h-6"></i>
                        </div>
                        <div>
                          <h2 className="text-xl font-bold text-white tracking-wide">{SLIDE_9_DATA.inoc.title}</h2>
                          <p className="text-xs text-slate-400">{SLIDE_9_DATA.inoc.subtitle}</p>
                        </div>
                      </div>

                      <div className="space-y-4 my-4">
                        <div className="bg-slate-950/60 border border-slate-800/80 rounded-lg p-3.5">
                          <div className="flex items-center gap-2 mb-2 text-teal-400">
                            <i data-lucide="activity" class="w-4 h-4"></i>
                            <h3 className="text-xs font-mono font-bold uppercase tracking-wider">Monitoring</h3>
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            {SLIDE_9_DATA.inoc.monitoring.map((mItem, idx) => (
                              <div key={idx} className="bg-slate-900/90 border border-slate-800 rounded p-2 text-xs text-slate-300 flex items-center gap-2 font-mono">
                                <span className="w-1.5 h-1.5 rounded-full bg-teal-400 animate-ping" />
                                <span className="truncate">{mItem}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className="bg-slate-950/60 border border-slate-800/80 rounded-lg p-3.5">
                          <div className="flex items-center gap-2 mb-2 text-teal-400">
                            <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
                            <h3 className="text-xs font-mono font-bold uppercase tracking-wider">International Network</h3>
                          </div>
                          
                          <div className="space-y-2 text-xs">
                            <div className="flex justify-between items-center bg-slate-900/90 p-2 rounded border border-slate-800">
                              <span className="text-slate-400 font-medium">IGW Providers & Customers:</span>
                              <span className="font-semibold text-teal-300 font-mono">
                                {SLIDE_9_DATA.inoc.architecture.providersCustomers.join(" • ")}
                              </span>
                            </div>

                            <div className="flex justify-between items-center bg-slate-900/90 p-2 rounded border border-slate-800">
                              <span className="text-slate-400 font-medium">Core Backbone:</span>
                              <span className="font-mono font-bold text-amber-400 px-2 py-0.5 bg-amber-500/10 border border-amber-500/30 rounded">
                                {SLIDE_9_DATA.inoc.architecture.core}
                              </span>
                            </div>

                            <div className="p-2 bg-slate-900/90 rounded border border-slate-800">
                              <span className="text-slate-400 font-medium block mb-1">IGW Peers:</span>
                              <div className="flex flex-wrap gap-1.5">
                                {SLIDE_9_DATA.inoc.architecture.peers.map((peer, pIdx) => (
                                  <span key={pIdx} className="bg-slate-800 text-slate-200 px-2 py-0.5 rounded text-[11px] border border-slate-700">
                                    {peer}
                                  </span>
                                ))}
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs">
                      <span className="text-slate-400 flex items-center gap-1.5 font-medium">
                        <i data-lucide="shield-check" class="w-4 h-4 text-teal-400"></i> Operational Status:
                      </span>
                      <span className="px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded font-mono text-xs font-bold border border-emerald-500/30 flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-400" /> Active Sync
                      </span>
                    </div>
                  </section>

                </div>
              </div>
            ) : (
              <div className="h-96 bg-slate-900/40 border border-slate-800 rounded-xl flex flex-col items-center justify-center p-8 text-center backdrop-blur-md">
                <i data-lucide="monitor" class="w-12 h-12 text-slate-600 mb-3"></i>
                <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest">Slide {currentSlide} of {SLIDES.length}</span>
                <h2 className="text-2xl font-bold text-slate-200 mt-1">{SLIDES[currentSlide - 1].name}</h2>
                <button 
                  onClick={() => setCurrentSlide(9)}
                  className="mt-6 px-4 py-2 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded-lg text-xs font-mono font-bold transition-all"
                >
                  Jump to Slide 9 (Datacom & iNOC)
                </button>
              </div>
            )}
          </main>

          {/* Footer Controls */}
          <footer className="border-t border-slate-800/80 bg-slate-950/90 backdrop-blur-md px-6 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2 font-mono text-xs text-slate-400">
              <i data-lucide="layers" class="w-4 h-4 text-slate-500"></i>
              <span>SLIDE <strong className="text-cyan-400">{String(currentSlide).padStart(2, '0')}</strong> / {SLIDES.length}</span>
            </div>

            <div className="hidden md:flex items-center gap-1 overflow-x-auto max-w-md py-1">
              {SLIDES.map((s) => (
                <button
                  key={s.id}
                  onClick={() => setCurrentSlide(s.id)}
                  className={`w-7 h-7 rounded font-mono text-xs flex items-center justify-center transition-all ${
                    currentSlide === s.id
                      ? 'bg-cyan-500 text-slate-950 font-bold shadow-lg shadow-cyan-500/20'
                      : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'
                  }`}
                >
                  {s.id}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => currentSlide > 1 && setCurrentSlide(p => p - 1)}
                disabled={currentSlide === 1}
                className="p-2 bg-slate-900 hover:bg-slate-800 disabled:opacity-30 border border-slate-800 rounded-lg text-slate-300 transition-colors"
              >
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
              </button>
              <button
                onClick={() => currentSlide < SLIDES.length && setCurrentSlide(p => p + 1)}
                disabled={currentSlide === SLIDES.length}
                className="p-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 disabled:opacity-30 rounded-lg font-bold transition-colors shadow-md shadow-cyan-500/20"
              >
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
              </button>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
