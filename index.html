  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xffccd5, 0.035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffb6c1, 1.8);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xdb2777, 2.5, 35);
    pointLight.position.set(0, 2, 5);
    scene.add(pointLight);

    // Wireframe Racks & Floating Torus Knots
    const rackGeo = new THREE.BoxGeometry(1.5, 6, 2);
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0xdb2777,
      wireframe: true,
      transparent: true,
      opacity: 0.6
    });

    const torusGeo = new THREE.TorusKnotGeometry(0.6, 0.2, 64, 16);
    const torusMat = new THREE.MeshBasicMaterial({
      color: 0xf472b6,
      wireframe: true,
      transparent: true,
      opacity: 0.7
    });

    const corridorObjects = [];

    for (let i = 0; i < 22; i++) {
      const zPos = -i * 4 + 10;

      // Left Rack
      const leftRack = new THREE.Mesh(rackGeo, wireMat);
      leftRack.position.set(-4.5, 0, zPos);
      scene.add(leftRack);
      corridorObjects.push(leftRack);

      // Right Rack
      const rightRack = new THREE.Mesh(rackGeo, wireMat);
      rightRack.position.set(4.5, 0, zPos);
      scene.add(rightRack);
      corridorObjects.push(rightRack);

      // Floating Torus Decors
      if (i % 3 === 0) {
        const torus = new THREE.Mesh(torusGeo, torusMat);
        torus.position.set((i % 2 === 0 ? 6 : -6), (Math.random() - 0.5) * 4, zPos);
        scene.add(torus);
        corridorObjects.push(torus);
      }
    }

    // Floor Grid Helper (Pink themed)
    const gridHelper = new THREE.GridHelper(80, 40, 0xbe185d, 0xf472b6);
    gridHelper.position.y = -3.2;
    scene.add(gridHelper);

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      camera.position.z -= 0.018;
      if (camera.position.z < -30) {
        camera.position.z = 10;
      }

      corridorObjects.forEach((obj, idx) => {
        obj.rotation.x += 0.002;
        obj.rotation.y += 0.003;
      });

      renderer.render(scene, camera);
    }
    animate();

    window.animateCameraOnSlideChange = function(slideIndex) {
      if (typeof gsap !== 'undefined') {
        gsap.to(camera.position, {
          x: (slideIndex % 2 === 0 ? 0.6 : -0.6),
          y: Math.sin(slideIndex) * 0.25,
          duration: 1.2,
          ease: "power2.out"
        });
      }
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

                      {slideData.stations.map((st, idx) => (
                        <div key={idx} className="bg-white/40 border border-pink-400/30 rounded-xl p-4 backdrop-blur-md">
                          <div className="flex justify-between items-center mb-2">
                            <h3 className="text-sm font-bold text-pink-950">{st.name}</h3>
                            <span className="w-2 h-2 rounded-full bg-pink-600 animate-pulse"></span>
                          </div>
                          <div className="flex flex-wrap gap-1">
                            {st.cables.map((c, cIdx) => (
                              <span key={cIdx} className="text-[10px] bg-pink-100 text-pink-800 border border-pink-300 px-2 py-0.5 rounded font-mono">
                                {c}
                              </span>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="bg-white/40 border border-pink-400/30 rounded-xl p-5 backdrop-blur-md">
                      <h3 className="text-xs font-mono font-bold text-pink-800 uppercase mb-3">Subsea Optical Diagnostic Suite</h3>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        {slideData.tech.map((t, idx) => (
                          <div key={idx} className="bg-white/60 border border-pink-300/40 p-3 rounded text-xs text-pink-900 flex items-center gap-2 font-mono">
                            <i data-lucide="activity" className="w-4 h-4 text-pink-600 shrink-0"></i>
                            <span>{t}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {currentSlide === 9 && (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <section className="bg-white/40 backdrop-blur-xl border border-pink-400/30 rounded-xl p-6 flex flex-col justify-between shadow-lg">
                      <div>
                        <div className="flex items-center gap-3 mb-5">
                          <div className="p-3 bg-pink-100 border border-pink-300 rounded-lg text-pink-700">
                            <i data-lucide="server" className="w-6 h-6"></i>
                          </div>
                          <div>
                            <h2 className="text-xl font-bold text-pink-950 tracking-wide">{slideData.datacom.title}</h2>
                            <p className="text-xs text-pink-800">{slideData.datacom.subtitle}</p>
                          </div>
                        </div>
                        <div className="space-y-3 my-4">
                          {slideData.datacom.services.map((svc, idx) => (
                            <div key={idx} className="bg-white/60 border border-pink-300/40 rounded-lg p-3.5">
                              <div className="flex items-center gap-2.5 mb-1">
                                <span className="px-2 py-0.5 text-xs font-mono font-bold bg-pink-100 text-pink-800 border border-pink-300 rounded">
                                  {svc.code}
                                </span>
                                <span className="text-sm font-semibold text-pink-950">{svc.name}</span>
                              </div>
                              <p className="text-xs text-pink-800 pl-1">{svc.desc}</p>
                              {svc.benefits && (
                                <div className="flex flex-wrap gap-1.5 pt-2 mt-2 border-t border-pink-200">
                                  <span className="text-[10px] text-pink-700 font-mono font-bold uppercase mr-1">Benefits:</span>
                                  {svc.benefits.map((b, bIdx) => (
                                    <span key={bIdx} className="text-[10px] bg-pink-100 text-pink-800 border border-pink-200 px-2 py-0.5 rounded">
                                      • {b}
                                    </span>
                                  ))}
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                      <div className="pt-4 border-t border-pink-300/30 flex items-center justify-between text-xs">
                        <span className="text-pink-800 font-medium">Devices:</span>
                        <div className="flex gap-2">
                          {slideData.datacom.devices.map((device, dIdx) => (
                            <span key={dIdx} className="px-3 py-1 bg-pink-100 text-pink-900 rounded font-mono text-xs font-bold border border-pink-300">
                              {device}
                            </span>
                          ))}
                        </div>
                      </div>
                    </section>

                    <section className="bg-white/40 backdrop-blur-xl border border-pink-400/30 rounded-xl p-6 flex flex-col justify-between shadow-lg">
                      <div>
                        <div className="flex items-center gap-3 mb-5">
                          <div className="p-3 bg-pink-100 border border-pink-300 rounded-lg text-pink-700">
                            <i data-lucide="globe" className="w-6 h-6"></i>
                          </div>
                          <div>
                            <h2 className="text-xl font-bold text-pink-950 tracking-wide">{slideData.inoc.title}</h2>
                            <p className="text-xs text-pink-800">{slideData.inoc.subtitle}</p>
                          </div>
                        </div>
                        <div className="space-y-4 my-4">
                          <div className="bg-white/60 border border-pink-300/40 rounded-lg p-3.5">
                            <div className="flex items-center gap-2 mb-2 text-pink-700">
                              <i data-lucide="activity" className="w-4 h-4"></i>
                              <h3 className="text-xs font-mono font-bold uppercase tracking-wider">Monitoring</h3>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                              {slideData.inoc.monitoring.map((mItem, idx) => (
                                <div key={idx} className="bg-white/80 border border-pink-200 rounded p-2 text-xs text-pink-900 flex items-center gap-2 font-mono">
                                  <span className="w-1.5 h-1.5 rounded-full bg-pink-600 animate-ping" />
                                  <span className="truncate">{mItem}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                      <div className="pt-4 border-t border-pink-300/30 flex items-center justify-between text-xs">
                        <span className="text-pink-800 font-medium">Operational Status:</span>
                        <span className="px-3 py-1 bg-pink-100 text-pink-800 rounded font-mono text-xs font-bold border border-pink-300">
                          Active Sync
                        </span>
                      </div>
                    </section>
                  </div>
                )}

                {currentSlide === 10 && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {slideData.features.map((f, idx) => (
                      <div key={idx} className="bg-white/40 border border-pink-400/30 rounded-xl p-6 backdrop-blur-md">
                        <div className="w-8 h-8 rounded-lg bg-pink-100 border border-pink-300 text-pink-700 flex items-center justify-center mb-4 font-mono font-bold text-sm">
                          0{idx + 1}
                        </div>
                        <h2 className="text-base font-bold text-pink-950 mb-2">{f.title}</h2>
                        <p className="text-xs text-pink-800 leading-relaxed">{f.desc}</p>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}

          </main>

          {/* Footer Controls matching user screenshot */}
          <footer className="border-t border-pink-400/30 bg-[#ffccd5]/90 backdrop-blur-md px-6 py-3 flex items-center justify-between font-mono text-xs text-pink-900">
            <div className="flex items-center gap-4">
              <span>SYS: ONLINE</span>
              <span className="hidden sm:inline">DEPTH: 0.00m</span>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-pink-700">NAV:</span>
              <div className="flex items-center gap-1">
                {SLIDES.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => setCurrentSlide(s.id)}
                    className={`w-6 h-6 rounded text-[10px] flex items-center justify-center transition-all ${
                      currentSlide === s.id
                        ? 'bg-pink-700 text-white font-bold'
                        : 'bg-white/60 text-pink-800 hover:bg-pink-200 border border-pink-300'
                    }`}
                  >
                    {s.id}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-2">
              <span>SLIDE: {String(currentSlide).padStart(2, '0')}/{SLIDES.length}</span>
              <div className="flex gap-1 ml-2">
                <button
                  onClick={() => currentSlide > 1 && setCurrentSlide(p => p - 1)}
                  disabled={currentSlide === 1}
                  className="px-2 py-1 bg-white/60 hover:bg-pink-200 disabled:opacity-30 border border-pink-300 rounded text-pink-900"
                >
                  &larr;
                </button>
                <button
                  onClick={() => currentSlide < SLIDES.length && setCurrentSlide(p => p + 1)}
                  disabled={currentSlide === SLIDES.length}
                  className="px-2 py-1 bg-pink-700 hover:bg-pink-600 text-white disabled:opacity-30 rounded font-bold"
                >
                  &rarr;
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
